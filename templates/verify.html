<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Verify your email</title>
  <style>
    body{font-family: Arial; padding: 2rem;}
    .box{max-width:480px;margin:0 auto;padding:1rem;border:1px solid #ddd;border-radius:6px;}
    input[type="text"]{width:100%;padding:0.5rem;margin:0.5rem 0;font-size:1rem;}
    button{padding:0.6rem 1rem;font-size:1rem;}
    .message{margin-top:1rem;color:#d00;}
  </style>
</head>
<body>
  <div class="box">
    <h2>Verify your Gmail</h2>
    <p>There has been a code forwarded in your G-Mail Id ({{ email }}). Please enter it in the box below.</p>

    <input id="code" type="text" maxlength="6" placeholder="Enter 6-digit code" />
    <button id="submitBtn">Verify</button>

    <div id="status" class="message"></div>
  </div>

  <script>
    document.getElementById('submitBtn').addEventListener('click', async function() {
      const code = document.getElementById('code').value.trim();
      const status = document.getElementById('status');
      status.textContent = "Verifying...";
      try {
        const res = await fetch("/verify-code", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({code})
        });
        const data = await res.json();
        if (data.ok) {
          status.style.color = "green";
          status.textContent = data.msg || "Verified";
          setTimeout(()=> window.location.href = "/", 1200);
        } else {
          status.style.color = "red";
          status.textContent = data.msg || "Verification failed.";
        }
      } catch (err) {
        status.style.color = "red";
        status.textContent = "Network error.";
      }
    });
  </script>
</body>
</html>
